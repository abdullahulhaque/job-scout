name: Job Scout

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch:        # lets you trigger it manually from GitHub UI

permissions:
  contents: write           # needed to commit seen_jobs.json back to the repo

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-jobspy pandas

      - name: Run Job Scout
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py

      # Commit the updated seen_jobs.json so next run doesn't re-send the same jobs
      - name: Save seen jobs
        run: |
          git config user.name "job-scout-bot"
          git config user.email "bot@github.com"
          git add seen_jobs_*.json
          git diff --staged --quiet || git commit -m "chore: update seen jobs [skip ci]"
          git push
